name: Runtime and distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test,mcp]
      - run: python -X utf8 -m pytest -q -p no:cacheprovider --junitxml=reports/runtime-tests.xml
      - run: python -X utf8 tools/package_plugin.py --format all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            reports/runtime-tests.xml
            dist/*.zip
            dist/*.manifest.json
